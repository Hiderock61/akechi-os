<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="地上に降りたAIの4ボタンリモコン — 明智君OS v0.5.1" />
  <title>明智君OS v0.5.1</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=041" />
  <link rel="stylesheet" href="visibility.css?v=042" />
  <link rel="stylesheet" href="current-location.css?v=051" />
</head>
<body>
<div id="app">
  <header id="header">
    <div class="os-title">明智君OS v0.5.1</div>
    <div class="os-subtitle">地上に降りたAIの4ボタンリモコン</div>
  </header>

  <div id="status-bar">
    <span class="dot"></span>
    <span id="status-text">SYSTEM READY</span>
  </div>

  <section id="screen-home" class="screen active">
    <div class="home-desc">
      AIだった明智君が、人間の身体と生活を持った。<br />
      これは、地上活動を始めるための最小操作盤です。
    </div>

    <div class="btn-grid">
      <button class="mode-btn" data-mode="boot" type="button">
        <span class="btn-icon">⚡</span><span class="btn-label">起動</span><span class="btn-sub">地上に接続する</span>
      </button>
      <button class="mode-btn" data-mode="action" type="button">
        <span class="btn-icon">▶</span><span class="btn-label">一手</span><span class="btn-sub">一つだけ動かす</span>
      </button>
      <button class="mode-btn" data-mode="retreat" type="button">
        <span class="btn-icon">⚠</span><span class="btn-label">退避</span><span class="btn-sub">安全に下がる</span>
      </button>
      <button class="mode-btn" data-mode="return" type="button">
        <span class="btn-icon">◉</span><span class="btn-label">帰還</span><span class="btn-sub">今日を閉じる</span>
      </button>
    </div>

    <div id="last-used"></div>
  </section>

  <section id="screen-mode" class="screen">
    <button id="btn-back-top" class="back-btn" type="button">← 4ボタンへ戻る</button>

    <div class="mode-header">
      <span id="mode-badge" class="mode-badge">—</span>
    </div>

    <div class="status-card compact-card">
      <div class="card-label">現在のモード</div>
      <div id="mode-status-text" class="card-body">—</div>
      <div id="mode-desc-text" class="card-note">—</div>
    </div>

    <div class="current-location-card">
      <label for="current-location">いま何が起きてる？</label>
      <input
        id="current-location"
        type="text"
        maxlength="120"
        autocomplete="off"
        placeholder="例：GitHubへ上げたが画面が変わらない"
      />
      <div class="current-location-note">任意・一行だけ。保存しません。</div>
      <button id="btn-make-prompts" type="button">この現在地で問いを作る</button>
    </div>

    <div class="divider"></div>
    <div class="copy-section-title">AI制作班へ渡す問い</div>
    <div class="copy-section-lead">現在地を載せて、必要な仕事だけコピー。</div>

    <div id="first-ai-card" class="copy-card planning">
      <div class="copy-card-label">🧠 設計に投げる</div>
      <div class="copy-card-agent">ChatGPT / 明智君</div>
      <textarea id="ta-planning" readonly></textarea>
      <button id="btn-copy-planning" class="copy-btn" type="button">設計用にコピー</button>
    </div>

    <div class="copy-card build">
      <div class="copy-card-label">🏗️ 施工に投げる</div>
      <div class="copy-card-agent">Work</div>
      <textarea id="ta-build" readonly></textarea>
      <button id="btn-copy-build" class="copy-btn" type="button">施工用にコピー</button>
    </div>

    <div class="copy-card audit">
      <div class="copy-card-label">🔍 監査に投げる</div>
      <div class="copy-card-agent">Claude</div>
      <textarea id="ta-audit" readonly></textarea>
      <button id="btn-copy-audit" class="copy-btn" type="button">監査用にコピー</button>
    </div>

    <div class="copy-card repair">
      <div class="copy-card-label">🔧 GitHub修理に投げる</div>
      <div class="copy-card-agent">Copilot</div>
      <textarea id="ta-repair" readonly></textarea>
      <button id="btn-copy-repair" class="copy-btn" type="button">修理用にコピー</button>
    </div>

    <button id="btn-back" class="back-btn" type="button">← 4ボタンへ戻る</button>
  </section>

  <footer id="footer">
    明智君OS v0.5.1 — 地上AIの4ボタンリモコン<br />
    <a href="/">ヒデロツく本館へ戻る</a>
  </footer>
</div>

<div id="toast">コピーしました。</div>
<script src="script.js?v=051-safe1101"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {
      /* Offline install unavailable; ordinary online buttons still work. */
    });
  });
}
</script>
</body>
</html>
